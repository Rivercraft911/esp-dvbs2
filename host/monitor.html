<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live link</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0b0f14;
  --panel: #121820;
  --hair: #1d2530;
  --grid: rgba(150, 175, 200, 0.08);
  --ink: #e8eef5;
  --ink-2: #9aabbd;
  --ink-3: #5c6b7c;
  --blue: #7cc8ff;
  --amber: #ffb86b;
  --good: #4fd6a2;
  --warn: #ffc457;
  --bad: #ff5f6f;
  --u: clamp(1px, 0.0625vw, 1.45px);
  --gap: calc(10 * var(--u));
  color-scheme: dark;
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font: 400 calc(14 * var(--u))/1.3 "Archivo", "Avenir Next", "Helvetica Neue", sans-serif;
  font-variant-numeric: tabular-nums;
  display: grid; grid-template-rows: auto auto minmax(0, 1fr);
  gap: var(--gap); padding: calc(14 * var(--u)) calc(18 * var(--u));
  min-height: 100vh;
}

/* Header: the name, the carrier, and the ground-station clock */
.head { display: flex; align-items: center; gap: calc(22 * var(--u)); padding: 0 calc(2 * var(--u)); }
.mark { font-size: calc(17 * var(--u)); font-weight: 700; font-variation-settings: "wdth" 125; letter-spacing: 0.01em; }
.tune { display: flex; align-items: baseline; gap: calc(16 * var(--u)); color: var(--ink-2); margin-right: auto; }
.tune span + span { padding-left: calc(16 * var(--u)); border-left: 1px solid var(--hair); }
.tune b { color: var(--ink); font-weight: 450; }
.clock { display: flex; align-items: baseline; gap: calc(10 * var(--u)); }
.clock .tag { font-size: calc(12.5 * var(--u)); font-weight: 650; letter-spacing: 0.08em; color: var(--ink-3); }
.clock .time { font-size: calc(24 * var(--u)); font-weight: 380; font-variation-settings: "wdth" 80; letter-spacing: 0.02em; }
.clock[data-s="good"] .tag { color: var(--good); }
.clock[data-s="warn"] .tag { color: var(--warn); }
.clock[data-s="idle"] .time { color: var(--ink-3); }

/* Panels: a tone shift, no outlines */
.panel { background: var(--panel); border-radius: 6px; min-height: 0; min-width: 0; display: flex; flex-direction: column; }
.ph { display: flex; align-items: center; gap: 8px; padding: calc(9 * var(--u)) calc(12 * var(--u)) calc(4 * var(--u)); }
.ph h2 { font-size: calc(13 * var(--u)); font-weight: 600; color: var(--ink-2); }
.ph .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-3); margin-left: auto; }
.ph .dot[data-s="good"] { background: var(--good); }
.ph .dot[data-s="bad"] { background: var(--bad); }
.pb { position: relative; flex: 1; min-height: 0; }
.pb canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.legend { display: inline-flex; gap: 12px; margin-left: auto; color: var(--ink-3); font-size: calc(12.5 * var(--u)); }
.legend i { display: inline-block; width: 12px; height: 2px; vertical-align: middle; margin-right: 6px; }

/* Readouts across the top */
.kpis { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); padding: calc(10 * var(--u)) 0 calc(8 * var(--u)); }
.kpi { padding: 0 calc(14 * var(--u)); display: grid; grid-template-rows: auto auto calc(22 * var(--u)); gap: 2px; min-width: 0; }
.kpi + .kpi { border-left: 1px solid var(--hair); }
.kpi span { color: var(--ink-3); font-size: calc(12.5 * var(--u)); white-space: nowrap; }
.kpi b { font-size: calc(30 * var(--u)); font-weight: 380; font-variation-settings: "wdth" 80; line-height: 1.05; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi b small { font-size: 0.45em; color: var(--ink-2); margin-left: 4px; font-variation-settings: "wdth" 100; font-weight: 400; }
.kpi b.good { color: var(--good); }
.kpi b.bad { color: var(--bad); }
.kpi canvas { width: 100%; height: 100%; display: block; }

/* Main */
.main { display: grid; grid-template-columns: minmax(0, 1fr) clamp(320px, 23vw, 520px); gap: var(--gap); min-height: 0; }
.radio { display: grid; grid-template-rows: minmax(0, 24fr) minmax(0, 42fr) minmax(0, 34fr); gap: var(--gap); min-height: 0; }
.lower { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: var(--gap); min-height: 0; }
.lower .square { aspect-ratio: 1; height: 100%; }
.axis { position: relative; height: calc(20 * var(--u)); flex: none; color: var(--ink-3); font-size: calc(12 * var(--u)); }
.axis span { position: absolute; top: 2px; transform: translateX(-50%); white-space: nowrap; }
.readout {
  position: absolute; pointer-events: none; padding: 5px 8px; border-radius: 4px; z-index: 2; display: none;
  background: rgba(11, 15, 20, 0.94); border: 1px solid var(--hair); font-size: calc(12.5 * var(--u)); white-space: nowrap;
}
.empty { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; color: var(--ink-3); padding: 16px; font-size: calc(13 * var(--u)); }
.empty[hidden] { display: none; }

.rail { display: flex; flex-direction: column; gap: var(--gap); min-height: 0; overflow: auto; }
.rail > * { flex: none; }
.rows { padding: 0 calc(12 * var(--u)) calc(8 * var(--u)); display: grid; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; min-height: calc(25 * var(--u)); font-size: calc(13.5 * var(--u)); line-height: 1.2; }
.row + .row { border-top: 1px solid var(--hair); }
.row span { color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row b { font-weight: 480; text-align: right; }
.row b.bad { color: var(--bad); }
.row b.zero { color: var(--ink-3); font-weight: 400; }
.meter { display: grid; grid-template-columns: auto calc(84 * var(--u)); gap: 10px; align-items: center; }
.meter em { display: block; height: 4px; border-radius: 2px; background: rgba(124, 200, 255, 0.12); overflow: hidden; }
.meter em i { display: block; height: 100%; width: 0; background: var(--blue); border-radius: 2px; transition: width 400ms; }
.meter em i.hot { background: var(--warn); }

@media (max-width: 1150px) {
  body { min-height: auto; }
  .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); row-gap: 14px; }
  .kpi:nth-child(4) { border-left: 0; }
  .main { grid-template-columns: 1fr; }
  .radio { grid-template-rows: 240px 360px auto; }
  .lower { grid-template-columns: 1fr; }
  .lower .square { height: auto; width: 100%; max-width: 420px; }
  .lower .wave { height: 220px; }
}
</style>
</head>
<body>
<header class="head">
  <div class="mark">esp-dvbs2</div>
  <div class="tune"><span><b id="freq">&ndash;</b></span><span id="mode">&ndash;</span></div>
  <div class="clock" id="clock" data-s="idle" role="status" title="AOS: time since the receiver acquired the signal. LOS: time since it lost it.">
    <span class="tag" id="clockTag">AOS</span><span class="time" id="clockTime">--:--:--</span>
  </div>
</header>

<section class="panel kpis" aria-label="The link at a glance">
  <div class="kpi"><span>Video out</span><b id="kRate">&ndash;</b><canvas id="sRate"></canvas></div>
  <div class="kpi"><span>MER</span><b id="kMer">&ndash;</b><canvas id="sMer"></canvas></div>
  <div class="kpi" title="Pilot MER minus the DVB-S2 decoding threshold Es/N0 for this MODCOD (EN 302 307-1 Table 13, normal frames)"><span>Link margin</span><b id="kMargin">&ndash;</b><canvas id="sMargin"></canvas></div>
  <div class="kpi"><span>Frames exact</span><b id="kFrames">&ndash;</b><canvas id="sFrames"></canvas></div>
  <div class="kpi"><span>Delivered</span><b id="kBytes">&ndash;</b><canvas id="sBytes"></canvas></div>
  <div class="kpi" title="Every error counter from the CM5's SPI to pv view, summed"><span>Errors, end to end</span><b id="kErrors">&ndash;</b><canvas id="sErrors"></canvas></div>
</section>

<main class="main">
  <section class="radio" aria-label="What the receiver hears">
    <div class="panel"><div class="ph"><h2>Spectrum</h2></div>
      <div class="pb" id="specWell"><canvas id="spectrum"></canvas><div class="readout" id="specRead"></div><div class="empty" id="emptySpec">Waiting for the receiver</div></div></div>
    <div class="panel"><div class="ph"><h2>Waterfall</h2></div>
      <div class="pb" id="fallWell"><canvas id="waterfall"></canvas><div class="readout" id="fallRead"></div></div><div class="axis" id="freqAxis"></div></div>
    <div class="lower">
      <div class="panel square"><div class="ph"><h2>Constellation</h2></div>
        <div class="pb"><canvas id="constellation"></canvas><div class="empty" id="emptyConst">Waiting for symbols</div></div></div>
      <div class="panel wave"><div class="ph"><h2>I/Q</h2><span class="legend"><span><i style="background:var(--blue)"></i>I</span><span><i style="background:var(--amber)"></i>Q</span></span></div>
        <div class="pb"><canvas id="waveform"></canvas><div class="empty" id="emptyWave">Waiting for samples</div></div></div>
    </div>
  </section>

  <aside class="rail" aria-label="Devices">
    <div class="panel"><div class="ph"><h2>Cameras, CM5</h2><i class="dot" id="dCam"></i></div><div class="rows" id="camRows"></div></div>
    <div class="panel"><div class="ph"><h2>Transmitter, ESP32-S3</h2><i class="dot" id="dTx"></i></div><div class="rows" id="txRows"></div></div>
    <div class="panel"><div class="ph"><h2>Receiver, ESP32-S3</h2><i class="dot" id="dRx"></i></div><div class="rows" id="rxRows"></div></div>
    <div class="panel"><div class="ph"><h2>Ethernet and viewer</h2><i class="dot" id="dView"></i></div><div class="rows" id="viewRows"></div></div>
  </aside>
</main>

<script>
'use strict';
const $ = id => document.getElementById(id);
const nf = new Intl.NumberFormat('en-US');
const css = getComputedStyle(document.documentElement);
const token = name => css.getPropertyValue(name).trim();
const ui = () => Math.min(1.45, Math.max(1, innerWidth / 1600));
const gutter = () => 54 * ui();                       // CSS px left of the spectrum and waterfall plots
const DASH = '–';

// One light-blue ramp for both densities: power over time and frequency, symbols over I and Q.
const RAMP = ['#121820', '#0f2134', '#0f365a', '#145385', '#2377ba', '#4aa2e2', '#8fd0ff', '#e2f5ff'];
const LUT = (() => {
  const rgb = RAMP.map(h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)));
  const lut = new Uint8ClampedArray(256 * 4);
  for (let i = 0; i < 256; i++) {
    const x = i / 255 * (rgb.length - 1), k = Math.min(Math.floor(x), rgb.length - 2), f = x - k;
    for (let c = 0; c < 3; c++) lut[i * 4 + c] = rgb[k][c] + (rgb[k + 1][c] - rgb[k][c]) * f;
    lut[i * 4 + 3] = 255;
  }
  return lut;
})();

// DVB-S2 quasi-error-free Es/N0 in dB, EN 302 307-1 Table 13 (normal frames, AWGN), by MODCOD.
const THRESHOLD = { 4: 1.00, 5: 2.23, 6: 3.10, 7: 4.03, 8: 4.68, 9: 5.18, 10: 6.20, 11: 6.42,
  12: 5.50, 13: 6.62, 14: 7.91, 15: 9.35, 16: 10.69, 17: 11.03 };
const MODCODS = { 4: 'QPSK 1/2', 5: 'QPSK 3/5', 6: 'QPSK 2/3', 7: 'QPSK 3/4', 8: 'QPSK 4/5', 9: 'QPSK 5/6', 10: 'QPSK 8/9',
  11: 'QPSK 9/10', 12: '8PSK 3/5', 13: '8PSK 2/3', 14: '8PSK 3/4', 15: '8PSK 5/6', 16: '8PSK 8/9', 17: '8PSK 9/10' };

function fit(canvas) {
  const r = canvas.getBoundingClientRect(), d = devicePixelRatio || 1;
  const w = Math.max(1, Math.round(r.width * d)), h = Math.max(1, Math.round(r.height * d));
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
  return [w, h, d];
}
function niceTicks(lo, hi, step) {
  const out = [];
  for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) out.push(v);
  return out;
}
const font = (d, px = 12) => `${px * d * ui()}px Archivo, sans-serif`;

const seen = {};
const fresh = (name, ms = 2500) => seen[name] && performance.now() - seen[name] < ms;
const state = { rx: null, tx: null, cm5: null, viewer: null, rate: 16e6, aos: null, los: null, history: [] };

// ---- Constellation ---------------------------------------------------------------------------
const N = 512, SPAN = 84;
const density = new Float32Array(N * N);
let densityPeak = 1, bitsPerSymbol = 3;
const constImg = new ImageData(N, N), constOff = new OffscreenCanvas(N, N);

function addSymbols(iq, bits) {
  bitsPerSymbol = bits;
  for (let i = 0; i < density.length; i++) density[i] *= 0.9;
  for (let k = 0; k + 1 < iq.length; k += 2) {
    const i = iq[k] + Math.random() - 0.5, q = iq[k + 1] + Math.random() - 0.5;   // undo the int8 lattice
    const x = Math.round((i + SPAN) / (2 * SPAN) * (N - 1)), y = Math.round((SPAN - q) / (2 * SPAN) * (N - 1));
    if (x >= 1 && x < N - 1 && y >= 1 && y < N - 1)
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) density[(y + dy) * N + x + dx] += (dx ? 0.5 : 1) * (dy ? 0.5 : 1);
  }
  let peak = 0;
  for (let i = 0; i < density.length; i++) if (density[i] > peak) peak = density[i];
  densityPeak = densityPeak * 0.8 + peak * 0.2;
  const scale = 255 / Math.log1p(densityPeak);
  for (let i = 0; i < density.length; i++) {
    const v = Math.min(255, Math.log1p(density[i]) * scale) | 0;
    constImg.data.set(LUT.subarray(v * 4, v * 4 + 4), i * 4);
  }
  constOff.getContext('2d').putImageData(constImg, 0, 0);
  $('emptyConst').hidden = true;
}

function drawConstellation() {
  const c = $('constellation'), [w, h, d] = fit(c), g = c.getContext('2d');
  g.imageSmoothingEnabled = true; g.imageSmoothingQuality = 'high';
  g.clearRect(0, 0, w, h);
  const side = Math.min(w, h), ox = (w - side) / 2, oy = (h - side) / 2;
  g.drawImage(constOff, ox, oy, side, side);
  const cx = ox + side / 2, cy = oy + side / 2, r = 64 / SPAN * side / 2;
  g.lineWidth = d; g.strokeStyle = token('--grid');
  g.beginPath(); g.moveTo(ox, cy); g.lineTo(ox + side, cy); g.moveTo(cx, oy); g.lineTo(cx, oy + side); g.stroke();
  g.beginPath(); g.arc(cx, cy, r, 0, 2 * Math.PI); g.stroke();
  const points = bitsPerSymbol === 3 ? 8 : 4, offset = bitsPerSymbol === 3 ? 0 : Math.PI / 4;
  g.strokeStyle = 'rgba(226,245,255,0.18)';
  for (let k = 0; k < points; k++) {
    const a = offset + k * 2 * Math.PI / points;
    g.beginPath(); g.arc(cx + r * Math.cos(a), cy - r * Math.sin(a), 0.14 * r, 0, 2 * Math.PI); g.stroke();
  }
}

// ---- I/Q: the first 32 us of each snapshot, with a short persistence -------------------------
const traces = [];
function addSamples(iq, rate) {
  traces.unshift({ iq, rate });
  if (traces.length > 6) traces.pop();
  $('emptyWave').hidden = true;
}
function drawWaveform() {
  const c = $('waveform'), [w, h, d] = fit(c), g = c.getContext('2d');
  g.clearRect(0, 0, w, h);
  const gx = 42 * d * ui(), pad = 10 * d, base = h - 18 * d * ui(), n = 512;
  const y = v => (base + pad) / 2 - v / 128 * ((base - pad) / 2);
  g.lineWidth = d; g.font = font(d); g.textAlign = 'right';
  for (const v of [-96, 0, 96]) {
    g.strokeStyle = token('--grid'); g.beginPath(); g.moveTo(gx, y(v)); g.lineTo(w, y(v)); g.stroke();
    g.fillStyle = token('--ink-3'); g.fillText(v ? `${v > 0 ? '+' : '−'}0.75` : '0', gx - 8 * d, y(v) + 4 * d);
  }
  g.textAlign = 'left';
  if (!traces.length) return;
  const rate = traces[0].rate, X = k => gx + k / (n - 1) * (w - gx);
  for (let t = traces.length - 1; t >= 0; t--) {
    const iq = traces[t].iq;
    for (const [off, color] of [[1, token('--amber')], [0, token('--blue')]]) {
      g.strokeStyle = color; g.globalAlpha = t === 0 ? 1 : 0.2 * (1 - t / traces.length);
      g.lineWidth = (t ? 1 : 1.4) * d; g.lineJoin = 'round';
      g.beginPath();
      for (let k = 0; k < n; k++) { const v = iq[2 * k + off]; k ? g.lineTo(X(k), y(v)) : g.moveTo(X(k), y(v)); }
      g.stroke();
    }
  }
  g.globalAlpha = 1; g.fillStyle = token('--ink-3');
  const us = n / rate * 1e6;
  for (const t of niceTicks(0, us, 8)) {
    const label = `${t} µs`, x = X(t / us * (n - 1)), tw = g.measureText(label).width;
    g.fillText(label, Math.min(Math.max(gx, x - tw / 2), w - tw - 4 * d), h - 4 * d);
  }
}

// ---- Spectrum and waterfall ------------------------------------------------------------------
const ROWS = 600, BINS = 512;
const fallOff = new OffscreenCanvas(BINS, ROWS), fallCtx = fallOff.getContext('2d');
fallCtx.fillStyle = RAMP[0]; fallCtx.fillRect(0, 0, BINS, ROWS);
const rowImg = new ImageData(BINS, 1);
let avg = null, peak = null, floorDb = -90, topDb = -30, rows = 0;

function addSpectrum(db, rate) {
  state.rate = rate;
  const lin = db.map(v => Math.pow(10, v / 10));
  avg = avg ? avg.map((a, i) => a * 0.75 + lin[i] * 0.25) : lin;
  const avgDb = avg.map(v => 10 * Math.log10(v));
  peak = peak ? peak.map((p, i) => Math.max(p - 0.15, avgDb[i])) : avgDb.slice();
  const sorted = avgDb.slice().sort((a, b) => a - b);
  const f0 = sorted[Math.floor(BINS * 0.1)] - 4, t0 = sorted[BINS - 3] + 3;
  floorDb = rows ? floorDb * 0.95 + f0 * 0.05 : f0;
  topDb = rows ? topDb * 0.95 + t0 * 0.05 : t0;
  for (let i = 0; i < BINS; i++) {
    const t = 0.85 * Math.max(0, Math.min(1, (db[i] - floorDb) / (topDb - floorDb)));
    rowImg.data.set(LUT.subarray((t * 255 | 0) * 4, (t * 255 | 0) * 4 + 4), i * 4);
  }
  fallCtx.drawImage(fallOff, 0, 1);
  fallCtx.putImageData(rowImg, 0, 0);
  rows++;
  $('emptySpec').hidden = true;
}

function drawSpectrum() {
  const c = $('spectrum'), [w, h, d] = fit(c), g = c.getContext('2d');
  g.clearRect(0, 0, w, h);
  const lo = Math.floor((floorDb - 6) / 10) * 10, hi = Math.ceil((topDb + 6) / 10) * 10;
  const top = 22 * d * ui(), gx = gutter() * d, X = f => gx + f * (w - gx);
  const y = v => h - 4 * d - (v - lo) / (hi - lo) * (h - top - 4 * d);
  g.font = font(d); g.lineWidth = d;
  const step = (h - top) / d / ((hi - lo) / 10) < 22 * ui() ? 20 : 10;
  for (const v of niceTicks(lo, hi, step)) { g.strokeStyle = token('--grid'); g.beginPath(); g.moveTo(gx, y(v)); g.lineTo(w, y(v)); g.stroke(); }
  g.fillStyle = token('--ink-3'); g.textAlign = 'right';
  for (const v of niceTicks(lo, hi, step)) if (y(v) > top - 2 && y(v) < h - 2 * d) g.fillText(`${v}`, gx - 10 * d, y(v) + 4 * d);
  g.fillText('dB', gx - 10 * d, 14 * d * ui());
  g.textAlign = 'left';
  if (!avg) return;
  const s = state.rx;
  if (s && s.rate) {                                  // the DVB-S2 channel: 1.35 times the symbol rate
    const rs = s.rate === '5m' ? 5e6 : 1e6, half = rs * 1.35 / 2 / state.rate * (w - gx), mid = X(0.5), by = 8 * d * ui();
    g.strokeStyle = 'rgba(226,245,255,0.28)';
    g.beginPath(); g.moveTo(mid - half, by + 5 * d); g.lineTo(mid - half, by); g.lineTo(mid + half, by); g.lineTo(mid + half, by + 5 * d); g.stroke();
    g.fillStyle = token('--ink-3');
    g.fillText(`${(rs * 1.35 / 1e6).toFixed(2)} MHz`, mid + half + 8 * d, by + 7 * d);
  }
  const path = arr => { g.beginPath(); arr.forEach((v, i) => { const x = X((i + 0.5) / BINS); i ? g.lineTo(x, y(v)) : g.moveTo(x, y(v)); }); };
  const cur = avg.map(v => 10 * Math.log10(v));
  path(cur); g.lineTo(w, h); g.lineTo(gx, h); g.closePath();
  const grad = g.createLinearGradient(0, top, 0, h);
  grad.addColorStop(0, 'rgba(124,200,255,0.2)'); grad.addColorStop(1, 'rgba(124,200,255,0.0)');
  g.fillStyle = grad; g.fill();
  g.strokeStyle = 'rgba(154,171,189,0.3)'; g.lineWidth = d; path(peak); g.stroke();
  g.strokeStyle = token('--blue'); g.lineWidth = 1.5 * d; g.lineJoin = 'round'; path(cur); g.stroke();
}

function drawWaterfall() {
  const c = $('waterfall'), [w, h, d] = fit(c), g = c.getContext('2d');
  g.clearRect(0, 0, w, h);
  const gx = gutter() * d;
  if (!rows) return;
  // Always fill the panel: a young waterfall stretches its rows until there is one per pixel.
  const visible = Math.max(1, Math.min(rows, ROWS, Math.round(h / d)));
  g.imageSmoothingEnabled = true;
  g.drawImage(fallOff, 0, 0, BINS, visible, gx, 0, w - gx, h);
  const secs = visible / 10, step = secs > 40 ? 20 : secs > 16 ? 10 : secs > 6 ? 4 : 1;
  g.font = font(d); g.fillStyle = token('--ink-3'); g.textAlign = 'right';
  for (const t of niceTicks(0, secs, step)) {
    const yy = t / secs * h;
    if (t && yy < h - 8 * d) g.fillText(`${t} s`, gx - 10 * d, yy + 4 * d);
  }
  g.fillText('now', gx - 10 * d, 13 * d * ui());
  g.textAlign = 'left';
}

function drawAxis() {
  const axis = $('freqAxis'), s = state.rx, center = s && s.freq_mhz ? s.freq_mhz : null;
  const key = `${center}|${state.rate}|${axis.clientWidth}|${gutter()}`;
  if (axis.dataset.key === key) return;
  axis.dataset.key = key; axis.textContent = '';
  const half = state.rate / 2e6;
  for (const off of niceTicks(-half, half, 2)) {
    if (Math.abs(off) >= half) continue;
    const el = document.createElement('span');
    el.style.left = `calc(${gutter()}px + ${(off + half) / (2 * half)} * (100% - ${gutter()}px))`;
    el.textContent = center === null ? `${off > 0 ? '+' : ''}${off}` : `${(center + off).toFixed(0)}`;
    axis.appendChild(el);
  }
  const unit = document.createElement('span');
  unit.style.left = `${gutter() / 2}px`; unit.textContent = 'MHz';
  axis.appendChild(unit);
}

function hover(wellId, readId, fn) {
  const well = $(wellId), read = $(readId);
  well.addEventListener('pointermove', e => {
    const r = well.getBoundingClientRect(), gx = gutter();
    const fx = (e.clientX - r.left - gx) / (r.width - gx), fy = (e.clientY - r.top) / r.height;
    const text = fx >= 0 && fn(fx, fy);
    if (!text) { read.style.display = 'none'; return; }
    read.textContent = text; read.style.display = 'block';
    read.style.left = `${Math.min(e.clientX - r.left + 14, r.width - read.offsetWidth - 6)}px`;
    read.style.top = `${Math.max(6, e.clientY - r.top - 34)}px`;
  });
  well.addEventListener('pointerleave', () => { read.style.display = 'none'; });
}
const freqAt = fx => {
  const center = state.rx && state.rx.freq_mhz, off = (fx - 0.5) * state.rate / 1e6;
  return center ? `${(center + off).toFixed(3)} MHz` : `${off >= 0 ? '+' : ''}${off.toFixed(3)} MHz`;
};
hover('specWell', 'specRead', fx => avg && `${freqAt(fx)}, ${(10 * Math.log10(avg[Math.min(BINS - 1, fx * BINS | 0)])).toFixed(1)} dBFS`);
hover('fallWell', 'fallRead', (fx, fy) => rows && `${freqAt(fx)}, ${(fy * Math.min(rows, ROWS, $('waterfall').clientHeight) / 10).toFixed(1)} s ago`);

// ---- Readouts ---------------------------------------------------------------------------------
function spark(id, idx) {
  const c = $(id), [w, h, d] = fit(c), g = c.getContext('2d');
  g.clearRect(0, 0, w, h);
  const pts = state.history.filter(p => typeof p[idx] === 'number');
  if (pts.length < 2) return;
  const t1 = pts[pts.length - 1][0], t0 = Math.max(pts[0][0], t1 - 600), use = pts.filter(p => p[0] >= t0);
  let lo = Math.min(...use.map(p => p[idx])), hi = Math.max(...use.map(p => p[idx]));
  const pad = Math.max((hi - lo) * 0.15, Math.abs(hi) * 0.01, 1e-6); lo -= pad; hi += pad;
  const X = t => (t - t0) / Math.max(1, t1 - t0) * (w - 4 * d), Y = v => h - 3 * d - (v - lo) / (hi - lo) * (h - 6 * d);
  g.beginPath(); use.forEach((p, i) => i ? g.lineTo(X(p[0]), Y(p[idx])) : g.moveTo(X(p[0]), Y(p[idx])));
  g.strokeStyle = 'rgba(124,200,255,0.75)'; g.lineWidth = 1.2 * d; g.lineJoin = 'round'; g.stroke();
  const last = use[use.length - 1];
  g.fillStyle = token('--blue'); g.beginPath(); g.arc(X(last[0]), Y(last[idx]), 2.2 * d, 0, 2 * Math.PI); g.fill();
}
const bytes = n => n >= 1e9 ? [(n / 1e9).toFixed(2), 'GB'] : n >= 1e6 ? [(n / 1e6).toFixed(1), 'MB'] : [(n / 1e3).toFixed(0), 'kB'];
const val = (v, unit) => `${v}<small>${unit}</small>`;

function errorsEndToEnd(rx, tx, cm5, view) {
  const parts = [rx && [rx.failed, rx.crc8, rx.cc, rx.eth_dropped], tx && [tx.input_rejected, tx.input_lost, tx.input_overruns, tx.late_fills],
    cm5 && [cm5.ready_timeouts, cm5.dropped], view && [view.corrupt, view.gaps]].filter(Boolean).flat();
  return parts.length ? parts.reduce((a, b) => a + (b || 0), 0) : undefined;
}

// ---- Rows ------------------------------------------------------------------------------------
const fmt = v => v === undefined || v === null ? DASH : typeof v === 'number' ? nf.format(v) : v;
const zeroish = (v, errors) => ({ text: fmt(v), cls: v === undefined || v === null ? '' : v ? (errors ? 'bad' : '') : 'zero' });
function meter(pct) {
  if (typeof pct !== 'number') return { text: DASH };
  return { html: `<span class="meter">${pct.toFixed(0)}%<em><i class="${pct > 85 ? 'hot' : ''}" style="width:${Math.min(100, pct)}%"></i></em></span>` };
}
const pair = (a, b) => (a === undefined && b === undefined) ? { text: DASH }
  : { text: `${fmt(a)} / ${fmt(b)}`, cls: (a || 0) + (b || 0) ? 'bad' : 'zero' };
const mbps = v => typeof v === 'number' ? `${v.toFixed(2)} Mb/s` : DASH;
function fill(id, list) {
  const el = $(id);
  if (el.children.length !== list.length) el.innerHTML = list.map(() => '<div class="row"><span></span><b></b></div>').join('');
  list.forEach(([label, v], i) => {
    const row = el.children[i], value = v && typeof v === 'object' ? v : { text: fmt(v) };
    row.children[0].textContent = label;
    const b = row.children[1];
    if (value.html !== undefined) b.innerHTML = value.html; else b.textContent = value.text;
    b.className = value.cls || '';
  });
}
const modeName = s => s ? `${MODCODS[s.modcod] || 'MODCOD ' + s.modcod}${s.short ? ' short' : ''}` : DASH;
const hms = ms => { const s = Math.max(0, Math.floor(ms / 1000)); return [Math.floor(s / 3600), Math.floor(s / 60) % 60, s % 60].map(v => String(v).padStart(2, '0')).join(':'); };
const dot = (id, on, bad) => { $(id).dataset.s = bad ? 'bad' : on ? 'good' : 'idle'; };

function render() {
  const rx = fresh('rx') ? state.rx : null, tx = fresh('tx', 3500) ? state.tx : null;
  const cm5 = fresh('cm5', 3500) ? state.cm5 : null, view = fresh('viewer', 3500) ? state.viewer : null;
  const s = state.rx || state.tx;

  // Header
  if (state.rx && state.rx.freq_mhz) $('freq').textContent = `${state.rx.freq_mhz.toFixed(3)} MHz`;
  else if (state.tx && state.tx.freq_mhz) $('freq').textContent = `${Number(state.tx.freq_mhz).toFixed(3)} MHz`;
  if (s) $('mode').textContent = `${modeName(s)}, ${state.rx ? (state.rx.rate === '5m' ? 5 : 1) : (s.symbol_rate || 0) / 1e6} Msym/s`;
  const clock = $('clock'), locked = rx && rx.state === 'track';
  if (locked) {
    if (!state.aos) state.aos = Date.now();
    state.los = null;
    clock.dataset.s = 'good'; $('clockTag').textContent = 'AOS'; $('clockTime').textContent = hms(Date.now() - state.aos);
  } else if (state.aos || state.los) {
    if (!state.los) state.los = Date.now();
    state.aos = null;
    clock.dataset.s = 'warn'; $('clockTag').textContent = 'LOS'; $('clockTime').textContent = hms(Date.now() - state.los);
  } else { clock.dataset.s = 'idle'; $('clockTag').textContent = 'AOS'; $('clockTime').textContent = '--:--:--'; }

  // Readouts
  const mer = rx ? (rx.mer_med_db ?? rx.mer_db) : undefined, th = rx ? THRESHOLD[rx.modcod] : undefined;
  $('kRate').innerHTML = rx && typeof rx.mbps === 'number' ? val(rx.mbps.toFixed(2), 'Mb/s') : DASH;
  $('kMer').innerHTML = typeof mer === 'number' ? val(mer.toFixed(1), 'dB') : DASH;
  $('kMargin').innerHTML = typeof mer === 'number' && th !== undefined ? val(`${mer - th >= 0 ? '+' : '−'}${Math.abs(mer - th).toFixed(1)}`, 'dB') : DASH;
  $('kFrames').textContent = rx && typeof rx.frames === 'number' ? nf.format(rx.frames) : DASH;
  if (rx && typeof rx.packets === 'number') { const [v, u] = bytes(rx.packets * 188); $('kBytes').innerHTML = val(v, u); } else $('kBytes').textContent = DASH;
  const errs = errorsEndToEnd(rx, tx, cm5, view), ke = $('kErrors');
  ke.textContent = errs === undefined ? DASH : nf.format(errs);
  ke.className = errs === undefined ? '' : errs ? 'bad' : 'good';

  // Devices
  dot('dCam', cm5 && cm5.lifecycle !== 'stopped', cm5 && cm5.failed);
  fill('camRows', [
    ['Transport stream out', mbps(cm5 && cm5.mbps)],
    ['SPI messages', cm5 && cm5.messages],
    ['READY timeouts', cm5 ? zeroish(cm5.ready_timeouts, true) : undefined],
    ['Queue age', cm5 && typeof cm5.queue_age_ms === 'number' ? `${cm5.queue_age_ms.toFixed(0)} ms` : DASH],
  ]);
  const busy = pct => typeof pct === 'number' ? 100 - pct : undefined;
  const inErrors = tx && tx.input_bytes !== undefined ? (tx.input_rejected || 0) + (tx.input_lost || 0) + (tx.input_overruns || 0) : undefined;
  dot('dTx', !!tx, tx && (inErrors || tx.late_fills || tx.late_switches));
  fill('txRows', [
    ['Input', mbps(tx && tx.input_mbps)],
    ['Frames encoded', tx && tx.frames_encoded],
    ['Filler frames', tx && tx.dummies],
    ['Input errors', tx ? zeroish(inErrors, true) : undefined],
    ['Late fills / bank switches', tx ? pair(tx.late_fills, tx.late_switches) : undefined],
    ['Encoder, core 0', meter(busy(tx && tx.encoder_spare_pct))],
    ['Bank fill, core 1', meter(busy(tx && tx.fill_spare_pct))],
  ]);
  dot('dRx', locked, rx && (rx.failed || rx.crc8 || rx.cc));
  fill('rxRows', [
    ['Gain', rx && typeof rx.gain === 'number' ? `${rx.gain} dB` : DASH],
    ['Failed / LDPC repaired', rx ? pair(rx.failed, rx.ldpc) : undefined],
    ['TS packets', rx && rx.packets],
    ['CRC-8 / continuity errors', rx ? pair(rx.crc8, rx.cc) : undefined],
    ['Carrier offset', rx && typeof rx.cfo_hz === 'number' ? `${(rx.cfo_hz / 1000).toFixed(1)} kHz` : DASH],
    ['Clock offset', rx && typeof rx.clock_ppm === 'number' ? `${rx.clock_ppm.toFixed(1)} ppm` : DASH],
    ['Core 0', meter(rx && rx.core0_pct)],
  ]);
  const viewFps = view && view.fps ? Object.values(view.fps).filter(v => typeof v === 'number') : [];
  dot('dView', rx && rx.eth_sent > 0 && viewFps.some(v => v > 0), (rx && rx.eth_dropped) || (view && (view.corrupt || view.gaps)));
  fill('viewRows', [
    ['Link', rx && rx.eth_mbps_link ? `${rx.eth_mbps_link} Mb/s` : DASH],
    ['Datagrams sent / packets dropped', rx && rx.eth_sent !== undefined
      ? { text: `${fmt(rx.eth_sent)} / ${fmt(rx.eth_dropped ?? 0)}`, cls: rx.eth_dropped ? 'bad' : '' } : undefined],
    ['Decoded, A / B', viewFps.length ? `${viewFps.map(v => v.toFixed(0)).join(' / ')} fps` : DASH],
    ['Corrupt packets / gaps', view ? pair(view.corrupt, view.gaps) : undefined],
  ]);

  if (rx) state.history.push([Date.now() / 1000, rx.mbps, mer, typeof mer === 'number' && th !== undefined ? mer - th : undefined, rx.frames, rx.packets, errs]);
  if (state.history.length > 2400) state.history.shift();
  ['sRate', 'sMer', 'sMargin', 'sFrames', 'sBytes', 'sErrors'].forEach((id, k) => spark(id, k + 1));
}

// ---- Events ----------------------------------------------------------------------------------
const decode = b64 => { const raw = atob(b64), out = new Int8Array(raw.length); for (let i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i) << 24 >> 24; return out; };
const events = new EventSource('/events');
events.addEventListener('hello', e => {
  const h = JSON.parse(e.data);
  state.rate = h.rate;
  for (const [k, v] of Object.entries(h.latest || {})) state[k] = v;
});
events.addEventListener('rx', e => { state.rx = JSON.parse(e.data); seen.rx = performance.now(); });
for (const name of ['tx', 'cm5', 'viewer']) events.addEventListener(name, e => { state[name] = JSON.parse(e.data); seen[name] = performance.now(); });
events.addEventListener('spectrum', e => { const m = JSON.parse(e.data); addSpectrum(m.db, m.rate); });
events.addEventListener('samples', e => { const m = JSON.parse(e.data); addSamples(decode(m.iq), m.rate); });
events.addEventListener('symbols', e => { const m = JSON.parse(e.data); addSymbols(decode(m.iq), m.bits); });

let last = 0;
function frame(t) {
  drawConstellation(); drawSpectrum(); drawWaterfall(); drawWaveform(); drawAxis();
  if (t - last > 250) { render(); last = t; }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
