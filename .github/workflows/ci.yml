name: ci
on: [push, pull_request]

jobs:
  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy scipy matplotlib
      - run: python host/plots.py --rf-only --check
      - run: python tests/test_dvbs2.py
      - run: python tests/test_dvbs2_8psk.py
      - run: python tests/test_dvbs2_c.py
      - run: python tests/test_stream.py
      - run: python tests/test_shaper_axes.py
      - run: python tests/test_vcm.py
      - run: python tests/test_vcm_decode.py
      - run: python tests/test_rational.py
      - run: python tests/test_8psk_26m667.py
      - run: python tests/test_8psk_queue.py
      - run: python tests/test_8psk_memory.py
      - run: python tests/test_fused.py
      - run: python tests/test_physolo.py
      - run: python tests/test_radio_duration.py
      - run: python tests/test_radio_filter.py
      - run: python tests/test_radio_calibration.py
      - run: python tests/test_qpsk_axes.py
      - run: python tests/test_self_check.py
      - run: python tests/test_live_video.py
      - run: python tests/test_soft_helper.py
      - run: python tests/test_live_iio.py
      - run: python tests/test_ota.py
      - run: python tests/test_file_ota.py
      - run: python tests/test_ota_vcm.py
      - run: python tests/test_live_vcm.py
      - run: python tests/test_rx_host.py
      - run: python tests/test_rx_kernels.py
      - name: SPI input
        run: |
          python tests/test_ingress.py
          python tests/test_pi_sender.py
          python tests/test_spi_input.py
          python tests/test_spi_pv.py
          python tests/test_spi_board.py
          python tests/test_spi_sender.py

      - name: USB payload input (no hardware)
        run: |
          python tests/test_usb_input.py
          python tests/test_usb_send.py
          python tests/test_filelink.py

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.1
          target: esp32s3
          path: firmware
